---
layout: chart
---


<div id='chart_0'></div>

<!-- project-specific js -->
<script type='text/javascript'>

  $(function () {

    $.when($.get('data/output/1-renter-owner-households.csv')).then(
      function(data){

        prep_data = ChartHelper.prep_chart_data(data, 'row', 'count');
        series_data = prep_data[0];
        years = prep_data[1];

        colors = ChartHelper.get_colors(2)
        $.each(series_data, function(i, series){
          series.color = colors[i];
        });

        // label each point in thousands (e.g. 567K), with a shared tooltip for exact counts
        overrides = {
          plotOptions: {
            line: {
              dataLabels: {
                enabled: true,
                formatter: function () {
                  return ChartHelper.formatAmount(this.y);
                }
              }
            }
          },
          tooltip: {
            shared: true,
            headerFormat: '<b>{point.key}</b><br/>',
            pointFormat: '<span style="color:{point.color}">●</span> {series.name}: <b>{point.y:,.0f}</b><br/>'
          }
        }

        ChartHelper.make_line_chart('#chart_0', series_data, years, ["Number of Renter and Owner Households", "City of Chicago, 2012-2019, 2021-2024"], 'Households', 'count', overrides)
    });
  });

</script>
