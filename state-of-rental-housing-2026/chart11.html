---
layout: chart
---


<div id='chart_0'></div>

<!-- project-specific js -->
<script type='text/javascript'>

  $(function () {

    $.when($.get('data/output/11-cost-burden-severity.csv')).then(
      function(data){

        prep_data = ChartHelper.prep_chart_data(data, 'col', 'percentage');
        series_data = prep_data[0];
        years = prep_data[1];

        // same colors as the rent burden by income chart (figure 12)
        colors = {
          'Cost Burdened': '#EDAB50',
          'Severely Cost Burdened': '#CE603B'
        };
        $.each(series_data, function(i, series){
          series.color = colors[series.name];
          series.borderWidth = 0;
          series.dataLabels = {
            enabled: true,
            format: '{y:.1f}%',
            color: ChartHelper.label_color(series.color),
            style: {
              fontFamily: '"GibsonSemiBold", sans-serif',
              fontSize: '12px',
              fontWeight: 'normal',
              textOutline: 'none',
              textShadow: 'none'
            }
          };
        });

        plot_options = {
            column: {
              stacking: 'normal',
              groupPadding: 0.08,
              pointPadding: 0.02
            },
            series: {
              states: {
                hover: {
                  enabled: false
                }
              }
            }
          }

        tooltip = {
            enabled: false
          }

        // total cost burdened (matches figure 10) above each bar
        overrides = {
          yAxis: {
            reversedStacks: false,  // stack in series order: cost burdened at the bottom, severely cost burdened on top
            labels: {
              formatter: function () {
                return this.value + '%';
              }
            },
            stackLabels: {
              enabled: true,
              formatter: function () {
                return Highcharts.numberFormat(this.total, 1) + '%';
              },
              style: {
                fontFamily: '"GibsonSemiBold", sans-serif',
                fontSize: '12px',
                fontWeight: 'normal',
                color: '#333',
                textOutline: 'none'
              }
            }
          }
        }

        ChartHelper.make_bar_chart('#chart_0', series_data, years, ["Share of Renter Households that were Cost-Burdened by Severity", "City of Chicago, 2012-2019, 2021-2024"], 'Percent', plot_options, tooltip, overrides)
    });
  });

</script>
