---
layout: chart
---

<div id='chart_0'></div>

<!-- project-specific js -->
<script type="text/javascript">

    $(function () {

      $.when($.get('data/output/6-indexed-change-building-size.csv')).then(
        function(data){

          var csv_arrays = $.csv.toArrays(data);
          var years = csv_arrays[0].slice(1);
          var rows = csv_arrays.slice(1);
          // Single-Unit, 2-to-4 Unit, 5-to-49 Unit, 50+ Units
          var colors = ['#EEA250', '#CC563A', '#7F9AC2', '#375481'];

          var series_data = $.map(rows, function(row, i){
            return [{
              name: row[0],
              data: $.map(row.slice(1), function(v){ return parseFloat(v); }),
              color: colors[i]
            }];
          });

          // four lines: hide per-point labels and use a shared tooltip instead
          var overrides = {
            plotOptions: {
              line: {
                dataLabels: { enabled: false }
              },
              series: {
                states: { hover: { enabled: true } }
              }
            },
            tooltip: {
              enabled: true,
              shared: true,
              borderColor: '#eee',
              shadow: false,
              headerFormat: '<b>{point.key}</b><br/>',
              pointFormat: '<span style="color:{point.color}">●</span> {series.name}: <b>{point.y:.1f}%</b><br/>'
            },
            yAxis: {
              plotLines: [{ value: 0, color: '#999', width: 1, zIndex: 2 }]
            }
          };

          ChartHelper.make_line_chart('#chart_0', series_data, years, ['Indexed Change in Rental Units by Building Size', 'City of Chicago, percent change since 2012'], 'Percent', 'percent', overrides);

      });
    });

</script>
